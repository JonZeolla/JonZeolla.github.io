<!doctype html>
<html><head><meta charset="utf-8">
<!-- Template for scripts/thumbnails.sh card. Fonts load from Google here only because this renders offline to a PNG; the site itself self-hosts them. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:#0c1118;color:#e7e3da;font-family:"IBM Plex Sans",sans-serif;position:relative}
.ring{position:absolute;right:-180px;bottom:-260px;width:620px;height:620px;border-radius:50%;background:#5ab4ff;opacity:.10}
.ring2{position:absolute;left:-120px;top:-200px;width:420px;height:420px;border-radius:50%;border:2px solid #253142}
.ev{position:absolute;left:80px;top:72px;font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#5ab4ff}
.t{position:absolute;left:80px;top:150px;width:760px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.d{position:absolute;left:80px;bottom:72px;font-family:"JetBrains Mono",monospace;font-size:20px;color:#93a0b1;letter-spacing:.08em}
.who{position:absolute;right:80px;bottom:72px;display:flex;align-items:center;gap:20px}
.who img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #253142}
.who div{text-align:right}
.who b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px}
.who span{color:#93a0b1;font-size:18px}
</style></head><body>
<div class="ring"></div><div class="ring2"></div>
<div class="ev">{{EVENT}}</div>
<div class="t">{{TITLE}}</div>
<div class="d">{{DATE}}</div>
<div class="who"><div><b>Jon Zeolla</b><span>Founder, Zenable</span></div><img src="headshot.png"></div>
</body></html>
