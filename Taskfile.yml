---
# https://taskfile.dev

version: '3'

set:
  - nounset
  - errexit
  - pipefail

silent: true

# This sets the watch interval to .5s; https://taskfile.dev/usage/#watch-tasks
interval: '500ms'

tasks:
  lock:
    desc: Update uv.lock if pyproject.toml has changed
    internal: true
    sources:
      - pyproject.toml
    generates:
      - uv.lock
    cmds:
      - uv lock

  init-uv:
    desc: Initializes uv if uv.lock changes
    internal: true
    sources:
      - uv.lock
    cmds:
      - uv sync

  runner-apt-install:
    desc: Install something on a GitHub Actions runner via apt
    internal: true
    status:
      - '{{if eq .GITHUB_ACTIONS "true"}}exit 1{{end}}'
    requires:
      vars: [TOOLS]
    preconditions:
      - sudo apt-get update
    platforms: [linux]
    cmds:
      - for:
          var: TOOLS
          split: ','
          as: tool
        cmd: sudo apt-get install -y --no-install-recommends {{.tool}}

  mac-brew-install:
    desc: Install something on a mac via brew
    internal: true
    platforms: [darwin]
    requires:
      vars: [TOOLS]
    cmds:
      - for:
          var: TOOLS
          split: ','
          as: tool
        cmd: brew install {{.tool}}

  init-install-tools:
    desc: Install required tools
    internal: true
    cmds:
      - task: runner-apt-install
        vars:
          TOOLS: xclip
      - task: mac-brew-install
        vars:
          TOOLS: opentofu

  init-npm:
    desc: Install node dependencies if package-lock.json changes
    internal: true
    sources:
      - package-lock.json
    cmds:
      - npm ci

  init:
    desc: Initialize the repo for local use; intended to be run after git clone
    deps: [lock]
    cmds:
      - task: init-uv
      - task: init-npm
      - task: init-install-tools
      - uv run playwright install --with-deps chromium

  dev:
    desc: Run the Astro dev server for the site (labs are not served here; use task build + task open)
    cmds:
      - npm run dev

  build-labs:
    desc: Build the Sphinx labs into build/ (tests read build/labs/)
    internal: true
    sources:
      - docs/**/*.md
      - docs/**/*.py
      - docs/**/*.rst
      - docs/_static/**/*
      - docs/_templates/**/*
    cmds:
      # Same font files the Astro site self-hosts, so the labs match without a third-party request
      - mkdir -p docs/_static/fonts
      - cp node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2 node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2 node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-{400,500,600}-normal.woff2 docs/_static/fonts/
      - uv run sphinx-build -b html docs build

  build-site:
    desc: Build the Astro site into dist/
    internal: true
    sources:
      - src/**/*
      - public/**/*
      - data/**/*
      - docs/ref/jz-content.md
      - astro.config.mjs
      - package-lock.json
    cmds:
      - npm run build

  build:
    desc: Build the whole site into dist/ (Astro pages + Sphinx labs merged in)
    cmds:
      - task: build-site
      - task: build-labs
      # Sphinx owns the labs and their references/assets; Astro owns every top-level page, so those are excluded.
      # Excludes are anchored to the top level so build/labs/index.html still ships.
      - rsync -a --exclude /index.html --exclude /about-me.html --exclude /resume.html --exclude /meet-with-jon.html --exclude /playlist.html --exclude /workshop.html --exclude /youtube.html build/ dist/

  open:
    desc: Open the built home page
    deps: [build]
    cmds:
      - open {{.ROOT_DIR}}/dist/index.html

  test-site:
    desc: Test the Astro site; run after `task build`
    cmds:
      - npm test
      - npx astro check
      - python3 -I scripts/check_links.py dist
      - uv run pytest -n0 tests/test_site.py

  test:
    desc: Run the lab tests (deploys EC2 via OpenTofu; local macOS only for now)
    deps: [clean, build]
    # Tests only work locally for now
    platforms: [darwin]
    env:
      LOG_LEVEL: '{{ .CLI_ARGS | default "INFO" }}'
      # Not used; change -n0 below to -n "${NUMBER_OF_LABS}" when tests are parallelizable
      NUMBER_OF_LABS:
        sh: find docs/labs/ -name '*.md' | wc -l
    cmds:
      - uv run pytest -n0 -v tests/ --log-cli-level "${LOG_LEVEL}"

  # Essentially an alias
  deploy:
    desc: Deploy the lab environment
    cmds:
      - task: deploy-lab

  # Essentially an alias
  lab:
    desc: Deploy the lab environment
    cmds:
      - task: deploy-lab

  deploy-lab:
    desc: Deploy the lab environment
    cmds:
      - cd lab && tofu init && tofu apply -auto-approve

  destroy:
    desc: Run tofu destroys and cleanup all of the labs and test opentofu modules
    cmds:
      - cd lab && tofu init && tofu destroy -auto-approve
      - |
        if [[ -z "${LAB+x}" ]]; then
          for dir in $(find tests -type d -maxdepth 1 -mindepth 1); do
            pushd "${dir}" >/dev/null
            echo "Running destroy in ${dir}..."
            tofu init
            tofu destroy -auto-approve
            popd >/dev/null
          done
        else
          pushd "tests/${LAB}" >/dev/null
          echo "Running destroy in tests/${LAB}..."
          tofu init
          tofu destroy -auto-approve
          popd >/dev/null
        fi

  update:
    desc: Update the project dependencies (Python via uv, Node via npm-check-updates), and other misc components
    cmds:
      - '{{if ne .GITHUB_ACTIONS "true"}}brew upgrade uv{{end}}'
      - uv lock --upgrade
      # Bumps package.json ranges to the latest versions (majors included); the PR workflow builds and tests the result
      - npx --yes npm-check-updates --upgrade
      - npm install

  clean:
    desc: Clean up build artifacts, cache files/directories, temp files, etc.
    cmds:
      - rm -rf {{.ROOT_DIR}}/build/
      - rm -rf {{.ROOT_DIR}}/dist/
      - rm -rf {{.ROOT_DIR}}/.astro/
      - find {{.ROOT_DIR}} -type d -name '.mypy_cache' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type d -name '.pytest_cache' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type d -name '.ruff_cache' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type d -name '.task' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type d -name '__pycache__' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type d -name 'coverage-reports' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type f -name '*.pyc' -delete
      - find {{.ROOT_DIR}} -type f -name '.DS_Store' -delete
      - find {{.ROOT_DIR}} -type f -name '.Thumbs.db' -delete
      - find {{.ROOT_DIR}} -type f -name '.coverage' -delete
      - find {{.ROOT_DIR}} -type d -name '.terraform' -exec rm -rf {} +
      - find {{.ROOT_DIR}} -type f -name '.terraform.lock.hcl' -delete
      # Leaving this commented out because it could accidentally kill state for a deployed environment; the above terraform lines should be enough
      # - find {{.ROOT_DIR}}/tests -type d -maxdepth 1 -mindepth 1 -exec rm -rf {} +
